<!DOCTYPE html>
<html lang="zh-CN" x-data="{ sidebarOpen: true, activeTab: 'overview', darkMode: false }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miyin Admin - TG 群组管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tg: {
                            blue: '#24A1DE',
                            dark: '#17212b',
                            light: '#f4f4f5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(23, 33, 43, 0.8); }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-200">

    <div class="flex min-h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 transition-all duration-300 flex flex-col z-50">
            <div class="h-16 flex items-center px-6 border-b border-gray-100 dark:border-slate-700 overflow-hidden">
                <i class="ri-robot-2-fill text-tg-blue text-2xl mr-3"></i>
                <span x-show="sidebarOpen" class="font-bold text-xl tracking-tight whitespace-nowrap">Miyin Bot</span>
            </div>
            
            <nav class="flex-1 p-4 space-y-2">
                <template x-for="item in [
                    { id: 'overview', name: '运行概览', icon: 'ri-dashboard-3-line' },
                    { id: 'bot', name: '机器人设置', icon: 'ri-settings-5-line' },
                    { id: 'security', name: '安全与拦截', icon: 'ri-shield-flash-line' },
                    { id: 'ai', name: 'AI 问答', icon: 'ri-openai-fill' },
                    { id: 'system', name: '系统维护', icon: 'ri-cpu-line' }
                ]">
                    <button @click="activeTab = item.id" 
                        :class="activeTab === item.id ? 'bg-blue-50 text-tg-blue dark:bg-slate-700 dark:text-blue-400' : 'hover:bg-gray-50 dark:hover:bg-slate-700 text-gray-500 dark:text-gray-400'"
                        class="w-full flex items-center p-3 rounded-xl transition-all group">
                        <i :class="item.icon" class="text-xl"></i>
                        <span x-show="sidebarOpen" class="ml-4 font-medium" x-text="item.name"></span>
                    </button>
                </template>
            </nav>

            <div class="p-4 border-t border-gray-100 dark:border-slate-700">
                <button @click="darkMode = !darkMode" class="w-full flex items-center p-3 text-gray-500 dark:text-gray-400 hover:text-tg-blue transition">
                    <i :class="darkMode ? 'ri-sun-line' : 'ri-moon-line'" class="text-xl"></i>
                    <span x-show="sidebarOpen" class="ml-4 font-medium" x-text="darkMode ? '浅色模式' : '深色模式'"></span>
                </button>
            </div>
        </aside>

        <!-- 主内容 -->
        <div class="flex-1 flex flex-col h-screen overflow-y-auto relative">
            <!-- 顶部栏 -->
            <header class="h-16 sticky top-0 z-40 glass border-b border-gray-200 dark:border-slate-700 flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <i class="ri-menu-2-line text-xl"></i>
                    </button>
                    <h2 class="text-lg font-semibold" x-text="{overview:'概览', bot:'机器人配置', security:'安全防护', ai:'AI 设置', system:'系统配置'}[activeTab]"></h2>
                </div>
                <div class="flex items-center gap-4">
                    <span class="flex items-center gap-1.5 text-xs font-medium text-green-600 bg-green-50 dark:bg-green-900/20 px-3 py-1.5 rounded-full border border-green-100 dark:border-green-800/30">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> 系统运行中
                    </span>
                    <div class="w-px h-6 bg-gray-200 dark:bg-slate-700 mx-2"></div>
                    <button class="flex items-center gap-2 text-sm font-medium hover:text-red-500 transition">
                        <i class="ri-logout-box-r-line"></i> 退出
                    </button>
                </div>
            </header>

            <main class="p-8">
                <!-- 概览标签页 -->
                <div x-show="activeTab === 'overview'" x-cloak class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                            <div class="flex justify-between items-start">
                                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 text-tg-blue rounded-xl"><i class="ri-group-line text-2xl"></i></div>
                                <span class="text-xs font-bold text-green-500 bg-green-50 px-2 py-1 rounded">+12%</span>
                            </div>
                            <p class="text-gray-500 text-sm mt-4 font-medium">活跃群组</p>
                            <h3 class="text-3xl font-bold mt-1 tracking-tight">24</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                            <div class="flex justify-between items-start">
                                <div class="p-3 bg-red-50 dark:bg-red-900/20 text-red-500 rounded-xl"><i class="ri-spam-2-line text-2xl"></i></div>
                            </div>
                            <p class="text-gray-500 text-sm mt-4 font-medium">拦截广告</p>
                            <h3 class="text-3xl font-bold mt-1 tracking-tight">1,429</h3>
                        </div>
                        <!-- 更多卡片... -->
                    </div>
                    
                    <!-- 实时日志视图预览 -->
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 overflow-hidden">
                        <div class="p-6 border-b border-gray-50 dark:border-slate-700 flex justify-between items-center">
                            <h3 class="font-bold flex items-center gap-2"><i class="ri-list-check text-blue-500"></i> 最近活动日志</h3>
                            <button class="text-sm text-tg-blue hover:underline">查看全部</button>
                        </div>
                        <div class="divide-y divide-gray-50 dark:divide-slate-700">
                            <div class="p-4 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-slate-700/50 transition">
                                <div class="flex items-center gap-4">
                                    <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                                    <div>
                                        <p class="text-sm font-medium">用户 @johndoe 完成了入群挑战</p>
                                        <p class="text-xs text-gray-400">2 分钟前</p>
                                    </div>
                                </div>
                                <span class="text-xs text-gray-500 font-mono">ID: 5291...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 配置表单页 (通用样式) -->
                <div x-show="['bot', 'security', 'ai'].includes(activeTab)" x-cloak class="max-w-4xl space-y-6">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                        <div class="p-6 border-b border-gray-50 dark:border-slate-700 font-bold text-lg">核心参数</div>
                        <div class="p-8 space-y-6">
                            <template x-if="activeTab === 'bot'">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Bot Token</label>
                                        <input type="password" class="w-full p-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-tg-blue outline-none transition" placeholder="7123456:AAH...">
                                    </div>
                                    <div class="space-y-2">
                                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Bot Username</label>
                                        <input type="text" class="w-full p-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-tg-blue outline-none transition" placeholder="@my_bot">
                                    </div>
                                </div>
                            </template>

                            <template x-if="activeTab === 'security'">
                                <div class="space-y-4">
                                    <div class="flex items-center justify-between p-5 bg-blue-50/50 dark:bg-blue-900/10 rounded-2xl border border-blue-100 dark:border-blue-800/30">
                                        <div>
                                            <p class="font-bold text-blue-900 dark:text-blue-300 text-lg">入群验证挑战 (Captcha)</p>
                                            <p class="text-sm text-blue-600 dark:text-blue-400 mt-1">防止机器人账号批量进群</p>
                                        </div>
                                        <label class="relative inline-flex items-center cursor-pointer scale-110">
                                            <input type="checkbox" class="sr-only peer" checked>
                                            <div class="w-12 h-6 bg-gray-300 dark:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-tg-blue"></div>
                                        </label>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">关键词黑名单 (逗号分隔)</label>
                                        <textarea rows="4" class="w-full p-4 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-tg-blue outline-none transition" placeholder="广告, 约炮, 刷单..."></textarea>
                                    </div>
                                </div>
                            </template>

                            <div class="flex justify-end pt-4">
                                <button class="bg-tg-blue hover:bg-blue-600 text-white px-10 py-3.5 rounded-xl font-bold transition-all shadow-lg shadow-blue-200 dark:shadow-none flex items-center gap-2">
                                    <i class="ri-save-line"></i> 保存设置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 系统维护 / 更新 -->
                <div x-show="activeTab === 'system'" x-cloak class="max-w-4xl space-y-6">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 p-8">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div class="flex items-center gap-6">
                                <div class="w-20 h-20 bg-slate-100 dark:bg-slate-700 rounded-3xl flex items-center justify-center text-4xl text-slate-500">
                                    <i class="ri-refresh-line"></i>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-bold">软件更新</h3>
                                    <p class="text-gray-500 dark:text-gray-400 mt-1">当前版本: <span class="font-mono bg-gray-100 dark:bg-slate-900 px-2 py-0.5 rounded text-tg-blue">V1.0.00</span></p>
                                </div>
                            </div>
                            <button class="bg-gray-900 dark:bg-white dark:text-slate-900 text-white px-8 py-3.5 rounded-2xl font-bold hover:scale-105 transition-transform">
                                检查更新
                            </button>
                        </div>

                        <!-- 更新进度条演示 -->
                        <div class="mt-10 p-6 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-100 dark:border-slate-800">
                            <div class="flex justify-between text-sm mb-3 font-medium">
                                <span>正在下载更新...</span>
                                <span class="text-tg-blue">65%</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-slate-800 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-tg-blue h-full w-[65%] rounded-full transition-all duration-500"></div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                            <h4 class="font-bold mb-4">修改管理员密码</h4>
                            <div class="space-y-4">
                                <input type="password" class="w-full p-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl outline-none" placeholder="原密码">
                                <input type="password" class="w-full p-3 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl outline-none" placeholder="新密码">
                                <button class="w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 font-bold py-3 rounded-xl transition">确认修改</button>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                            <h4 class="font-bold mb-4 text-red-500">危险区域</h4>
                            <p class="text-sm text-gray-500 mb-6">重启机器人会中断所有正在处理的验证任务，请谨慎操作。</p>
                            <div class="flex flex-col gap-3">
                                <button class="flex items-center justify-center gap-2 border border-red-200 dark:border-red-900/30 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/10 font-bold py-3 rounded-xl transition">
                                    <i class="ri-restart-line"></i> 重启应用
                                </button>
                                <button class="flex items-center justify-center gap-2 border border-gray-200 dark:border-slate-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-slate-700 font-bold py-3 rounded-xl transition">
                                    <i class="ri-delete-bin-line"></i> 清理数据库
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 浮动通知 (Toast) -->
    <div class="fixed bottom-8 right-8 z-[100] space-y-4">
        <div x-show="false" x-transition class="bg-white dark:bg-slate-800 border-l-4 border-green-500 p-4 rounded-xl shadow-2xl flex items-center gap-4 max-w-sm">
            <div class="w-10 h-10 bg-green-100 dark:bg-green-900/20 text-green-600 rounded-full flex items-center justify-center flex-shrink-0">
                <i class="ri-checkbox-circle-line text-xl"></i>
            </div>
            <div>
                <p class="font-bold text-sm">操作成功</p>
                <p class="text-xs text-gray-500">配置已成功保存并即时生效</p>
            </div>
        </div>
    </div>

</body>
</html>
